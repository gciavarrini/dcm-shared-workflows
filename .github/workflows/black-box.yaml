name: Black Box Tests

on:
  workflow_call:
    inputs:
      up-target:
        description: 'Make target to run to start services'
        type: string
      test-target:
        description: 'Make target to run to run tests'
        type: string
      down-target:
        description: 'Make target to run to stop services'
        type: string
      go-version-file:
        description: 'Path to go.mod file for Go version'
        type: string
        default: 'go.mod'
      images:
        description: 'Space-separated list of images to pre-pull'
        type: string
        default: ''

jobs:
  blackbox:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-version-file }}

      # Do not install Podman: compose service_healthy needs healthchecks that
      # actually run. Dockerd does that. Podman relies on systemd user timers
      # that often never fire on GHA (stuck starting / Log=null). 
      # See: https://github.com/podman-container-tools/podman/pull/27033
      # Prefer docker when both exist on the runner.
      - name: Detect container engine
        run: |
          if command -v docker >/dev/null 2>&1; then
            engine=docker
          elif command -v podman >/dev/null 2>&1; then
            engine=podman
          else
            echo "No docker or podman found on the runner" >&2
            exit 1
          fi
          echo "CONTAINER_ENGINE=$engine" >> "$GITHUB_ENV"
          echo "Using CONTAINER_ENGINE=$engine"
          "$engine" version

      - name: Pre-pull container images
        if: inputs.images != ''
        run: |
          for img in ${{ inputs.images }}; do
            for i in 1 2 3; do
              "$CONTAINER_ENGINE" pull "$img" && break
              [ $i -eq 3 ] && exit 1
              echo "Pull failed, retrying in 15s..."
              sleep 15
            done
          done

      - name: Start services
        run: make ${{ inputs.up-target }}

      - name: Run tests
        run: make ${{ inputs.test-target }}

      - name: Collect diagnostics
        if: failure() || cancelled()
        continue-on-error: true
        run: |
          set +e
          engine="${CONTAINER_ENGINE:-docker}"

          echo "::group::${engine} ps -a"
          "$engine" ps -a
          echo "::endgroup::"

          echo "::group::container health"
          for c in $("$engine" ps -aq 2>/dev/null); do
            name=$("$engine" inspect --format '{{.Name}}' "$c" 2>/dev/null || echo "$c")
            echo "--- $name ---"
            "$engine" inspect --format '{{json .State.Health}}' "$c"
          done
          echo "::endgroup::"

          echo "::group::container logs"
          for c in $("$engine" ps -aq 2>/dev/null); do
            name=$("$engine" inspect --format '{{.Name}}' "$c" 2>/dev/null || echo "$c")
            echo "--- $name ---"
            "$engine" logs --tail 200 "$c"
          done
          echo "::endgroup::"

      - name: Stop services
        if: always()
        run: make ${{ inputs.down-target }}
